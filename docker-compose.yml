name: axiom-ai

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATA_DIR=/app/data/docs
      - PERSIST_DIR=/app/storage
      # Optional: set GROQ_API_KEY in a local .env to use hosted Llama 3
      # instead of local Ollama. Empty means "fall back to Ollama".
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      # Docstore/index metadata. Persisted so documents aren't re-embedded and
      # duplicated in Qdrant on every restart.
      - ml_storage:/app/storage
      # Embedding weights (~1.3GB). Cached so a rebuild doesn't re-download them.
      - hf_cache:/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous: the first boot downloads the embedding model before serving.
      start_period: 600s

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      # Deliberately service_started, not service_healthy: the gateway answers
      # /health on its own and returns a clean 502 while ml-service is still
      # loading its model, so gating startup would only delay the UI.
      - ml-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so this
        # must be a build arg — a runtime env var would not reach the browser.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  qdrant_data:
  ml_storage:
  hf_cache:
