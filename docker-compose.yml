name: axiom-ai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=axiom
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-axiom-local-dev}
      - POSTGRES_DB=axiom
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Defaults to the ONNX build: quantized BGE embeddings through onnxruntime,
  # no torch. It is a ~1GB image that starts in under a minute and needs a few
  # hundred MB of RAM, and it is the same image the Render blueprint deploys.
  #
  # The higher-quality local stack (sentence-transformers + BAAI/bge-large,
  # ~4GB of image and 1.3GB of weights) is one file away:
  #   docker compose -f docker-compose.yml -f docker-compose.full.yml up --build
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.lite
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DATA_DIR=/app/data/docs
      - PERSIST_DIR=/app/storage
      - EMBED_BACKEND=${EMBED_BACKEND:-fastembed}
      # Which model Ollama is asked for. llama3 needs ~4GB of free RAM to load;
      # set LLM_MODEL=llama3.2:3b in .env on a smaller machine.
      - LLM_MODEL=${LLM_MODEL:-llama3}
      # Optional: set GROQ_API_KEY in a local .env to use hosted Llama 3
      # instead of local Ollama. Empty means "fall back to Ollama".
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      # Docstore/index metadata. Persisted so documents aren't re-embedded and
      # duplicated in Qdrant on every restart.
      - ml_storage:/app/storage
      # Embedding weights. Cached so a rebuild doesn't re-download them.
      - hf_cache:/app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      # The ONNX model is ~130MB, so first boot is quick. The full stack raises
      # this in docker-compose.full.yml, where 1.3GB has to come down first.
      start_period: 180s

  gateway:
    build: ./gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ML_SERVICE_URL=http://ml-service:8000
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - DATABASE_URL=postgres://axiom:${POSTGRES_PASSWORD:-axiom-local-dev}@postgres:5432/axiom?sslmode=disable
      # Signs access tokens. Left empty here on purpose — a secret committed to
      # the repo would be a secret in every deployment. The gateway generates an
      # ephemeral one and logs a warning, which only means sessions end when the
      # container restarts. Set JWT_SECRET in .env to keep them across restarts.
      - JWT_SECRET=${JWT_SECRET:-}
    depends_on:
      postgres:
        # The gateway can't serve auth without its database, and unlike the ML
        # service there is no useful degraded mode to start into.
        condition: service_healthy
      ml-service:
        # Deliberately service_started, not service_healthy: the gateway answers
        # /health on its own and returns a clean 502 while ml-service is still
        # loading its model, so gating startup would only delay the UI.
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at build time, so this
        # must be a build arg — a runtime env var would not reach the browser.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  qdrant_data:
  ml_storage:
  hf_cache:
