name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: gateway/go.sum

      - name: Verify go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  ml-service:
    name: ML Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test
        # conftest.py sets AXIOM_SKIP_MODEL_INIT=1, so no model weights are
        # downloaded and no Ollama/Groq endpoint is required.
        run: pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The ml-service image is built in its own job: it pulls multi-GB torch
      # wheels and needs the runner's disk freed first, so keeping it separate
      # lets these two small images fail fast.
      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./gateway
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ml-service-image:
    name: ML Service image
    runs-on: ubuntu-latest
    # Without this a wedged build would sit on the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The torch/CUDA wheel chain is multi-GB; the stock runner image doesn't
      # leave enough room for it alongside the preinstalled toolchains.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v4

      # No gha cache here on purpose: even the CPU-only image is well over a
      # gigabyte, and round-tripping that through the 10GB Actions cache costs
      # more than the rebuild it saves.
      - name: Build ml-service image
        uses: docker/build-push-action@v7
        with:
          context: ./ml-service
          push: false
          load: true
          tags: axiom-ml-service:ci

      # Guards a real failure mode: purging build-essential with --auto-remove
      # also removes libgomp1 (a gcc dependency) that torch links against, so
      # the image builds fine and then dies on `import torch` at runtime.
      - name: Smoke test imports
        run: |
          docker run --rm -e AXIOM_SKIP_MODEL_INIT=1 axiom-ml-service:ci \
            python -c "import torch, sentence_transformers, main; print('imports ok')"

      - name: Verify the container does not run as root
        run: |
          user=$(docker run --rm axiom-ml-service:ci whoami)
          echo "container user: $user"
          [ "$user" = "axiom" ]

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        run: docker compose config --quiet
